name: productivity-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productivity_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productivity_bot"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
